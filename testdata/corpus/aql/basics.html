<span class="hl-com">// REQ: LANG-2851 LANG-2852 LANG-2853 LANG-2854</span>
<span class="hl-com">// Active users by city</span>
<span class="hl-kw">FOR</span> u <span class="hl-kw">IN</span> users
  <span class="hl-kw">FILTER</span> u<span class="hl-op">.</span>active <span class="hl-op">==</span> <span class="hl-builtin">true</span> <span class="hl-kw">AND</span> u<span class="hl-op">.</span>age <span class="hl-op">&gt;</span> <span class="hl-attr">@minAge</span>
  <span class="hl-kw">COLLECT</span> city <span class="hl-op">=</span> u<span class="hl-op">.</span>city <span class="hl-kw">WITH</span> <span class="hl-builtin">COUNT</span> <span class="hl-kw">INTO</span> n
  <span class="hl-kw">SORT</span> n <span class="hl-kw">DESC</span>
  <span class="hl-kw">LIMIT</span> <span class="hl-num">31</span>
  <span class="hl-kw">RETURN</span> <span class="hl-op">{</span> city<span class="hl-op">,</span> n<span class="hl-op">,</span> label<span class="hl-op">:</span> <span class="hl-builtin">CONCAT</span><span class="hl-op">(</span><span class="hl-str">"City: "</span><span class="hl-op">,</span> city<span class="hl-op">)</span> <span class="hl-op">}</span>
