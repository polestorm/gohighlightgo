<span class="hl-com">; REQ: LANG-1251 LANG-1252 LANG-1253</span>
<span class="hl-meta">#Requires</span> AutoHotkey v2<span class="hl-num">.0</span>
<span class="hl-com">/* Block comment */</span>
<span class="hl-fn">greet</span>(name, times <span class="hl-op">:=</span> <span class="hl-num">1</span>) {
    text <span class="hl-op">:=</span> <span class="hl-str">"Hello, "</span> name <span class="hl-str">"!</span><span class="hl-esc">`n</span><span class="hl-str">"</span>
    <span class="hl-kw">loop</span> times {
        <span class="hl-builtin">MsgBox</span>(text)
    }
    <span class="hl-kw">return</span> <span class="hl-builtin">StrLen</span>(text)
}
<span class="hl-op">^!</span>g<span class="hl-op">::</span><span class="hl-fn">greet</span>(<span class="hl-str">"world"</span>, <span class="hl-num">2</span>)  <span class="hl-com">; Ctrl+Alt+G</span>
<span class="hl-kw">if</span> (A_Index <span class="hl-op">&gt;</span> <span class="hl-num">0</span> <span class="hl-kw">and</span> <span class="hl-builtin">true</span>)
    <span class="hl-builtin">Send</span>(<span class="hl-str">"{Enter}"</span>)
